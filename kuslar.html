<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Halka tel ve gitar teli üzerinde kuşlar: gezen ve duran dalga.">
  <meta name="robots" content="noindex">
  <title>Teldeki Kuşlar</title>
  <link rel="canonical" href="https://taylansengul.github.io/home/kuslar.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root { --kus-friend: #c08a2b; --kus-blue: #3b6ea5; --kus-green: #4f8a4b; --kus-purple: #7d5ba6; }
    @media (prefers-color-scheme: dark) { :root { --kus-friend: #e0b25a; --kus-blue: #7eaad9; --kus-green: #8cc58a; --kus-purple: #b59ae0; } }
    .page-header { margin-bottom: 1.2rem; padding-bottom: 1rem; }
    .stages { margin: 0.6rem 0 1.5rem; }
    .stage[hidden] { display: none; }
    .stage { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .stages canvas { display: block; width: 100%; }
    #ring, #str { cursor: pointer; touch-action: manipulation; }
    #ring { aspect-ratio: 2 / 1; }
    #str { aspect-ratio: 3 / 1; }
    .trace { height: 120px; }
    /* var(--x, yedek): styles.css yüklenmezse de çerçeve, renk ve font yerinde kalır */
    .controls { display: grid; grid-template-columns: auto 1fr; gap: 0.7rem 0.9rem; margin: 0; font-family: var(--mono, "IBM Plex Mono", monospace); font-weight: var(--mono-weight, 300); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted, #66615c); }
    @media (max-width: 640px) { .controls { grid-template-columns: 1fr; } }
    .box { margin: 0; min-width: 0; border: 1px solid var(--rule, #d8d0c4); padding: 0.3rem 0.9rem 0.55rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem 0.6rem; }
    .box legend { padding: 0 0.35rem; margin-left: -0.35rem; font-size: 0.65rem; }
    .box button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; background: none; border: 0; padding: 0.2rem 0; cursor: pointer; }
    .box button[aria-pressed="true"] { color: var(--accent, #8b3a1e); text-decoration: underline; text-underline-offset: 0.3em; }
    .box button:hover { color: var(--ink, #1a1a1a); }
    .bc button.dim { opacity: 0.35; transition: opacity 0.4s; }
    .params { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 0.4rem 1.8rem; }
    @media (max-width: 640px) { .params { grid-template-columns: 1fr; } }
    .params label { display: grid; grid-template-columns: 3.4em minmax(4rem, 1fr) 2.6em; align-items: center; gap: 0.6rem; }
    .params input[type=range] { width: 100%; margin: 0; accent-color: var(--accent, #8b3a1e); }
    .params output { text-align: right; color: var(--ink, #1a1a1a); }
    .params .omega { justify-self: end; font-family: var(--serif, "EB Garamond", Georgia, serif); font-size: 1rem; letter-spacing: 0; text-transform: none; color: var(--ink, #1a1a1a); white-space: nowrap; }
    .formula { margin: 0; text-align: center; font-family: var(--serif, "EB Garamond", Georgia, serif); font-size: 1.05rem; color: var(--ink, #1a1a1a); }
    .formula i, .params .omega i { font-style: italic; }
    .trace-note { margin: 0.8rem 0 0; font-size: 0.98rem; color: var(--muted, #66615c); max-width: 46rem; }
  </style>
</head>
<body id="top">
  <a class="skip-link" href="#main-content">İçeriğe geç</a>
  <nav aria-label="Ana gezinme">
    <ul class="nav-links">
      <li><a href="tr.html">Ana sayfa</a></li>
      <li><a href="yayinlar.html">Yayınlar</a></li>
      <li><a href="yazilar.html">Notlar</a></li>
    </ul>
  </nav>
  <main class="container" id="main-content">
    <header class="page-header">
      <p class="eyebrow"><time datetime="2026-11-13">13 Kasım 2026</time> · Animasyon</p>
      <h1>Teldeki Kuşlar</h1>
    </header>
    <div class="controls"><fieldset class="box"><legend>Dalga türü</legend><button type="button" id="mGezen" aria-pressed="false">Gezen <span lang="en">(traveling)</span></button> · <button type="button" id="mDuran" aria-pressed="true">Duran <span lang="en">(standing)</span></button></fieldset><fieldset class="box bc" id="bc"><legend>Sınır koşulu</legend><button type="button" id="bP" aria-pressed="false">Periyodik</button> · <button type="button" id="bS" aria-pressed="false">Sonsuz</button> · <button type="button" id="bD" lang="en" aria-pressed="true">Dirichlet</button> · <button type="button" id="bN" lang="en" aria-pressed="false">Neumann</button></fieldset>
      <fieldset class="box params"><legend>Parametreler</legend><label><span><i style="text-transform:none">n</i></span><input type="range" id="pn" min="1" max="6" step="1" value="3"><output id="on">3</output></label><label><span>Hız <i style="text-transform:none">c</i></span><input type="range" id="pc" min="0.2" max="2" step="0.05" value="1"><output id="oc">1.00</output></label><label><span>Kuş</span><input type="range" id="pN" min="4" max="40" step="1" value="20"><output id="oN">20</output></label><span class="omega" id="omega"></span></fieldset></div>
    <p class="trace-note" id="note"></p>
    <div class="stages" id="stages" role="img" aria-label="Halka tel ya da gitar teli üzerinde kuşlar; dalga gezen ya da duran. Bir kuşa tıklayınca seçilir ya da bırakılır.">
      <div class="stage" id="stRing" hidden><canvas id="ring"></canvas><p class="formula" id="fRing"></p><canvas id="ringTrace" class="trace"></canvas></div>
      <div class="stage" id="stStr"><canvas id="str"></canvas><p class="formula" id="fStr"></p><canvas id="strTrace" class="trace"></canvas></div>
    </div>
    <script>
    (() => {
      const $ = id => document.getElementById(id);
      // fb: styles.css yüklenmezse kullanılan renk (yoksa boş renk bir önceki çizginin rengini taşır)
      const css = (n, fb) => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb;
      let C = {};
      const readColors = () => { C = {
        pal: [['--accent', '#8b3a1e'], ['--kus-friend', '#c08a2b'], ['--kus-blue', '#3b6ea5'], ['--kus-green', '#4f8a4b'], ['--kus-purple', '#7d5ba6']].map(([n, fb]) => css(n, fb)),
        wire: css('--muted', '#66615c'), bird: css('--ink', '#1a1a1a'), line: css('--rule', '#d8d0c4'), eye: css('--bg', '#f5f1eb') }; };
      readColors();
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);

      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      // m: 0 gezen, 1 duran; düğmeyle seçilen hedefe yumuşak geçer
      // Halka: θ ∈ [0, 2π), tel: x ∈ [0, π]. Böylece k = n ve ω = nc ikisinde de aynı (c: dalga hızı).
      // t: dalganın fazı ωt, her karede ω·dt kadar ilerler (kaydırıcı oynayınca sıçramaz).
      // sel: seçili kuşlar, [sıra, renk yuvası] çiftleri; en çok PAL tane, renk kuşla birlikte kalır
      const S = { m: 1, target: 1, n: 3, c: 1, N: 20, t: 0, bc: 'D' }; // bc: P halka, S sonsuz tel, D/N uçları bağlı tel
      const isNeu = () => S.bc === 'N', isRing = () => S.bc === 'P', isPinned = () => S.bc === 'D' || S.bc === 'N';
      const PAL = 5;
      const sel = { ring: [[19, 1], [0, 0], [1, 2]], str: [[5, 1], [6, 0], [7, 2]] };
      const slotOf = (w, i) => { const e = sel[w].find(p => p[0] === i); return e ? e[1] : -1; };
      const toggleBird = (w, i) => {
        const L = sel[w], j = L.findIndex(p => p[0] === i);
        if (j >= 0) { L.splice(j, 1); return; }
        if (L.length >= PAL) L.shift();
        let k = 0; while (L.some(p => p[1] === k)) k++;
        L.push([i, k]);
      };
      const KAPPA = 1.25; // KAPPA: ekrandaki zamanın birimi
      const omega = () => S.n * S.c;
      // geo: son çizilen karede tellerin yeri; tıklanan kuş buradan bulunur
      const geo = { ring: null, str: null };

      const wave = (phi, w) => (Math.sin(phi - w) + S.m * Math.sin(phi + w)) / (1 + S.m);

      function fit(cv) {
        const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
        const W = Math.max(1, Math.round(r.width * d)), H = Math.max(1, Math.round(r.height * d));
        if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
        const ctx = cv.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0);
        return { ctx, w: r.width, h: r.height };
      }

      function bird(ctx, x, y, ang, s, fill) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
        ctx.strokeStyle = fill; ctx.lineWidth = Math.max(1, s * 0.09); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-0.15 * s, 0); ctx.lineTo(-0.08 * s, -0.4 * s); ctx.moveTo(0.15 * s, 0); ctx.lineTo(0.1 * s, -0.4 * s); ctx.stroke();
        ctx.fillStyle = fill;
        ctx.beginPath(); ctx.ellipse(0, -0.72 * s, 0.55 * s, 0.38 * s, -0.15, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-0.45 * s, -0.68 * s); ctx.lineTo(-1.05 * s, -0.45 * s); ctx.lineTo(-0.98 * s, -0.8 * s); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.arc(0.45 * s, -1.1 * s, 0.26 * s, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0.66 * s, -1.16 * s); ctx.lineTo(0.95 * s, -1.08 * s); ctx.lineTo(0.66 * s, -1.0 * s); ctx.closePath(); ctx.fill();
        ctx.fillStyle = C.eye; ctx.beginPath(); ctx.arc(0.52 * s, -1.15 * s, 0.06 * s, 0, 7); ctx.fill();
        ctx.restore();
      }

      const hist = { ring: [], str: [] };

      function drawRing(t) {
        const { ctx, w, h } = fit($('ring'));
        ctx.clearRect(0, 0, w, h);
        const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.36, A = R * 0.16;
        const P = th => { const r = R + A * wave(S.n * th, t); return [cx + r * Math.cos(th), cy + r * Math.sin(th)]; };
        ctx.setLineDash([3, 5]); ctx.strokeStyle = C.line; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke(); ctx.setLineDash([]);
        ctx.strokeStyle = C.wire; ctx.lineWidth = 2.2; ctx.beginPath();
        for (let i = 0; i <= 360; i++) { const [x, y] = P(i / 360 * 2 * Math.PI); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke();
        const NR = S.N, s = Math.max(3, Math.min(R * 0.075, 2 * Math.PI * R / NR * 0.38));
        geo.ring = { cx, cy, R, N: NR };
        for (let i = 0; i < NR; i++) {
          const th = i / NR * 2 * Math.PI, e = 1e-3;
          const [x, y] = P(th), [x1, y1] = P(th + e), [x0, y0] = P(th - e);
          const ang = Math.atan2(y1 - y0, x1 - x0);
          const k = slotOf('ring', i);
          bird(ctx, x, y, ang, k >= 0 ? s * 1.15 : s, k >= 0 ? C.pal[k] : C.bird);
        }
        return Array.from({ length: NR }, (_, i) => wave(S.n * (i / NR * 2 * Math.PI), t));
      }

      function drawStr(t) {
        const { ctx, w, h } = fit($('str'));
        ctx.clearRect(0, 0, w, h);
        const pinned = isPinned(); // D/N yalnız duran dalgayla seçilir, m = 1
        const x0 = w * 0.07, x1 = w * 0.93, L = x1 - x0, cy = h * 0.56, A = h * 0.3;
        const k = S.n * Math.PI / L;
        const ph = isNeu() ? Math.PI / 2 : 0;
        const Y = x => cy - A * wave(k * (x - x0) + ph, t);
        ctx.setLineDash([3, 5]); ctx.strokeStyle = C.line; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(pinned ? x0 : 0, cy); ctx.lineTo(pinned ? x1 : w, cy); ctx.stroke(); ctx.setLineDash([]);
        ctx.lineWidth = 2.2;
        if (pinned) {
          ctx.strokeStyle = C.wire; ctx.beginPath();
          for (let i = 0; i <= 300; i++) { const x = x0 + L * i / 300; i ? ctx.lineTo(x, Y(x)) : ctx.moveTo(x, Y(x)); }
          ctx.stroke();
          if (isNeu()) {
            ctx.lineWidth = 1.5; [x0, x1].forEach(x => { ctx.beginPath(); ctx.moveTo(x, cy - A * 1.35); ctx.lineTo(x, cy + A * 1.35); ctx.stroke(); });
            ctx.lineWidth = 2; ctx.fillStyle = C.eye; [x0, x1].forEach(x => { ctx.beginPath(); ctx.arc(x, Y(x), 5, 0, 7); ctx.fill(); ctx.stroke(); });
          } else { ctx.fillStyle = C.wire; [x0, x1].forEach(x => ctx.fillRect(x - 4, cy - 14, 8, 28)); }
        } else {
          const g = ctx.createLinearGradient(0, 0, w, 0);
          g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.07, C.wire); g.addColorStop(0.93, C.wire); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.strokeStyle = g; ctx.beginPath();
          for (let i = 0; i <= 400; i++) { const x = w * i / 400; i ? ctx.lineTo(x, Y(x)) : ctx.moveTo(x, Y(x)); }
          ctx.stroke();
        }
        const NS = S.N;
        const s = Math.max(3, Math.min(Math.min(w, h) * 0.038, L / NS * 0.45));
        geo.str = { x0, L, N: NS };
        for (let i = 0; i < NS; i++) {
          const x = x0 + L * (i + 0.5) / NS, e = 0.5;
          const j = slotOf('str', i);
          bird(ctx, x, Y(x), Math.atan2(Y(x + e) - Y(x - e), 2 * e), j >= 0 ? s * 1.15 : s, j >= 0 ? C.pal[j] : C.bird);
        }
        return Array.from({ length: NS }, (_, i) => wave(S.n * Math.PI * (i + 0.5) / NS + ph, t)); // piksele bağlı değil: gizli sekmede de doğru
      }

      function drawTrace(id, buf, w0) {
        const { ctx, w, h } = fit($(id));
        ctx.clearRect(0, 0, w, h);
        ctx.save();
        // sabit gri zaman ekseni: sağda ok ve t; iz çizgileri onun üstünde akar
        const xr = w - 16;
        ctx.strokeStyle = C.wire; ctx.fillStyle = C.wire; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(xr, h / 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(xr + 6, h / 2); ctx.lineTo(xr, h / 2 - 3.5); ctx.lineTo(xr, h / 2 + 3.5); ctx.closePath(); ctx.fill();
        ctx.font = 'italic 15px "EB Garamond", Georgia, serif'; ctx.textAlign = 'right'; ctx.fillText('t', w - 2, h / 2 - 7);
        if (buf.length < 2) { ctx.restore(); return; }
        const span = 4, tEnd = buf[buf.length - 1][0];
        const X = tt => xr - 4 - (tEnd - tt) / span * (xr - 4), Yv = v => h / 2 - v * (h / 2 - 6);
        ctx.beginPath(); ctx.rect(0, 0, xr - 3, h); ctx.clip();
        sel[w0].forEach(([j, k]) => {
          ctx.strokeStyle = C.pal[k]; ctx.lineWidth = 1.8; ctx.beginPath();
          let on = false;
          buf.forEach(b => { if (j >= b[1].length) { on = false; return; } const x = X(b[0]), y = Yv(b[1][j]); on ? ctx.lineTo(x, y) : ctx.moveTo(x, y); on = true; });
          ctx.stroke();
        });
        ctx.restore();
      }

      const NOTE = [
        'Gezen dalga yalnız periyodik telde ve sonsuz telde olur. Uçları bağlı telde (Dirichlet, Neumann) dalga uçtan yansır, geriye duran dalga kalır. Alttaki çizgiler son dört saniyede renkli kuşların yüksekliği. Bir kuşa tıklayınca seçilir ya da bırakılır. Gezen dalgada hepsi aynı salınımı yapar, her biri komşusundan biraz geç.',
        'Gezen dalga yalnız periyodik telde ve sonsuz telde olur. Uçları bağlı telde (Dirichlet, Neumann) dalga uçtan yansır, geriye duran dalga kalır. Alttaki çizgiler son dört saniyede renkli kuşların yüksekliği. Bir kuşa tıklayınca seçilir ya da bırakılır.'
      ];
      const nn = () => S.n === 1 ? '' : S.n;
      const formulas = () => {
        const n = nn(), f = isNeu() ? 'cos' : 'sin';
        const dom = S.bc === 'S' ? ', <i>x</i> ∈ ℝ' : ', 0 ≤ <i>x</i> ≤ π';
        $('fRing').innerHTML = S.target ? `<i>u</i> = sin ${n}<i>θ</i> · cos <i>ωt</i>` : `<i>u</i> = sin(${n}<i>θ</i> − <i>ωt</i>)`;
        $('fStr').innerHTML = (S.target ? `<i>u</i> = ${f} ${n}<i>x</i> · cos <i>ωt</i>` : `<i>u</i> = ${f}(${n}<i>x</i> − <i>ωt</i>)`) + dom;
        $('omega').innerHTML = `<i>ω</i> = <i>nc</i> = ${omega().toFixed(2)}`;
      };
      const label = () => { formulas(); $('stRing').hidden = !isRing(); $('stStr').hidden = isRing(); ['bD', 'bN'].forEach(b => $(b).classList.toggle('dim', !S.target)); [['bP', 'P'], ['bS', 'S'], ['bD', 'D'], ['bN', 'N']].forEach(([b, v]) => $(b).setAttribute('aria-pressed', S.bc === v ? 'true' : 'false')); $('note').innerHTML = NOTE[S.target]; $('mGezen').setAttribute('aria-pressed', S.target ? 'false' : 'true'); $('mDuran').setAttribute('aria-pressed', S.target ? 'true' : 'false'); };
      const setMode = v => { S.target = v; label(); if (reduced) { S.m = v; requestAnimationFrame(frame); } };
      // Kuşlar hızlı oynar, tıklama yüksekliğe bakmaz: halkada en yakın açı, telde en yakın sütun seçilir.
      const hit = (w, x, y) => {
        const g = geo[w]; if (!g) return -1;
        if (w === 'ring') {
          const d = Math.hypot(x - g.cx, y - g.cy); if (d < 0.5 * g.R || d > 1.6 * g.R) return -1;
          const a = (Math.atan2(y - g.cy, x - g.cx) + 2 * Math.PI) % (2 * Math.PI);
          return Math.round(a / (2 * Math.PI) * g.N) % g.N;
        }
        const i = Math.round((x - g.x0) / g.L * g.N - 0.5);
        return i >= 0 && i < g.N ? i : -1;
      };
      ['ring', 'str'].forEach(w => $(w).addEventListener('pointerdown', e => {
        const i = hit(w, e.offsetX, e.offsetY);
        if (i >= 0) { toggleBird(w, i); if (reduced) requestAnimationFrame(frame); }
      }));
      // uçları bağlı telde gezen dalga olmaz: Dirichlet ya da Neumann'dayken Gezen sonsuz tele geçer
      $('mGezen').addEventListener('click', () => { if (isPinned()) S.bc = 'S'; setMode(0); });
      $('mDuran').addEventListener('click', () => setMode(1));
      // Dirichlet ya da Neumann seçilince hemen duran dalgaya geçilir (geçiş anında uçlar oynamasın diye m = 1)
      const setBC = v => {
        S.bc = v;
        if (isPinned()) { S.m = 1; if (!S.target) setMode(1); }
        label(); if (reduced) requestAnimationFrame(frame);
      };
      [['bP', 'P'], ['bS', 'S'], ['bD', 'D'], ['bN', 'N']].forEach(([b, v]) => $(b).addEventListener('click', () => setBC(v)));
      const param = (id, out, key, fmt) => $(id).addEventListener('input', e => {
        S[key] = +e.target.value; $(out).textContent = fmt(S[key]); formulas();
        if (reduced) requestAnimationFrame(frame);
      });
      param('pn', 'on', 'n', v => v);
      param('pc', 'oc', 'c', v => v.toFixed(2));
      param('pN', 'oN', 'N', v => v);
      $('pN').addEventListener('input', () => { ['ring', 'str'].forEach(w => { sel[w] = sel[w].filter(p => p[0] < S.N); }); });

      label();
      let wall = performance.now(), clock = 0;
      function frame(now) {
        const dt = Math.min(0.05, (now - wall) / 1000); wall = now;
        clock += dt; S.t += dt * KAPPA * omega();
        S.m += (S.target - S.m) * Math.min(1, dt * 1.5);
        if (Math.abs(S.target - S.m) < 0.002) S.m = S.target;
        const r = drawRing(S.t), q = drawStr(S.t);
        hist.ring.push([clock, r]); hist.str.push([clock, q]);
        while (clock - hist.ring[0][0] > 4.2) hist.ring.shift();
        while (clock - hist.str[0][0] > 4.2) hist.str.shift();
        drawTrace('ringTrace', hist.ring, 'ring'); drawTrace('strTrace', hist.str, 'str');
        if (!reduced) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
    </script>
    <p class="post-back"><a href="yazilar.html">← Notlar</a></p>
  </main>
</body>
</html>
